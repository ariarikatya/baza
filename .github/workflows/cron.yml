name: Cron Notifier

on:
  schedule:
    - cron: "*/5 * * * *"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  run-crons:
    runs-on: ubuntu-24.04
    env:
      BASE_URL: ${{ vars.CRON_BASE_URL || 'https://baza-pink.vercel.app' }}
      SECRET: ${{ secrets.CRON_SECRET }}
    steps:
      - name: Execute Cron Endpoints
        run: |
          MINUTE=$(date -u +%-M)
          HOUR=$(date -u +%-H)
          EVENT_NAME="${{ github.event_name }}"

          echo "Trigger event: $EVENT_NAME, Current UTC time: $(date -u '+%Y-%m-%d %H:%M:%S') (Hour: $HOUR, Minute: $MINUTE)"
          echo "Base URL: $BASE_URL"

          if [ -z "$SECRET" ]; then
            echo "::error::CRON_SECRET repository secret is missing. Add it in Settings → Secrets and variables → Actions → Secrets → New repository secret (same value as in Vercel Production env)."
            exit 1
          fi

          echo "secret length: ${#SECRET}"

          HAS_401=false

          run_cron() {
            ENDPOINT="$1"
            URL="$BASE_URL/api/cron/$ENDPOINT"
            echo "----------------------------------------"
            echo "Executing: $ENDPOINT"

            RESPONSE=$(curl -s -H "Authorization: Bearer $SECRET" -w "\nHTTP_STATUS:%{http_code}" "$URL")
            HTTP_BODY=$(echo "$RESPONSE" | sed '$d')
            HTTP_STATUS=$(echo "$RESPONSE" | tail -n 1 | sed 's/HTTP_STATUS://')

            echo "HTTP Status Code: $HTTP_STATUS"
            echo "Response Body: $HTTP_BODY"

            if [ "$HTTP_STATUS" = "401" ]; then
              echo "::error::401 Unauthorized for endpoint $ENDPOINT! CRON_SECRET mismatch or missing."
              HAS_401=true
            elif [ "$HTTP_STATUS" != "200" ]; then
              echo "::warning::Endpoint $ENDPOINT returned HTTP status $HTTP_STATUS"
            fi
          }

          if [ "$EVENT_NAME" = "workflow_dispatch" ]; then
            echo "Manual trigger (workflow_dispatch): Running all 7 endpoints sequentially..."
            run_cron "checkGeneralNotifications"
            run_cron "checkGameNotifications"
            run_cron "checkAndCompleteTournaments"
            run_cron "notifyAbsentPlayers"
            run_cron "checkBountyAwards"
            run_cron "sendGameInvitations"
            run_cron "checkNewGameAnnouncements"
          else
            echo "Schedule trigger: Running active tasks for Minute=$MINUTE, Hour=$HOUR..."

            # Always run every 5 min
            run_cron "checkGeneralNotifications"
            run_cron "checkGameNotifications"
            run_cron "checkAndCompleteTournaments"

            # Multiples of 15 min
            if [ $((MINUTE % 15)) -eq 0 ]; then
              run_cron "notifyAbsentPlayers"
            fi

            # Multiples of 10 min
            if [ $((MINUTE % 10)) -eq 0 ]; then
              run_cron "checkBountyAwards"
            fi

            # Every hour at :00
            if [ "$MINUTE" -eq 0 ]; then
              run_cron "sendGameInvitations"
            fi

            # 13:00 UTC (16:00 MSK)
            if [ "$MINUTE" -eq 0 ] && [ "$HOUR" -eq 13 ]; then
              run_cron "checkNewGameAnnouncements"
            fi
          fi

          if [ "$HAS_401" = "true" ]; then
            echo "::error::One or more endpoints failed with 401 Unauthorized."
            exit 1
          fi
