name: Cron Notifier

on:
  schedule:
    - cron: "*/5 * * * *"
  workflow_dispatch:
  repository_dispatch:
    types: [run-crons]

permissions:
  contents: read

jobs:
  run-crons:
    runs-on: ubuntu-24.04
    env:
      BASE_URL: ${{ vars.CRON_BASE_URL || 'https://baza-pink.vercel.app' }}
      SECRET: ${{ secrets.CRON_SECRET }}
      CRON_ACTIVE_HOURS_UTC: ${{ vars.CRON_ACTIVE_HOURS_UTC || secrets.CRON_ACTIVE_HOURS_UTC || '' }}
    steps:
      - name: Restore last run timestamp from cache
        uses: actions/cache/restore@v4
        with:
          path: .cron-last-run.txt
          key: cron-last-run-${{ github.run_id }}-${{ github.run_number }}
          restore-keys: |
            cron-last-run-

      - name: Check for skipped schedule intervals
        run: |
          NOW=$(date +%s)
          if [ -f .cron-last-run.txt ]; then
            LAST_RUN=$(cat .cron-last-run.txt | tr -d '\r\n')
            if [[ "$LAST_RUN" =~ ^[0-9]+$ ]]; then
              DIFF=$((NOW - LAST_RUN))
              MINUTES=$((DIFF / 60))
              echo "Last run was $MINUTES minutes ago ($DIFF seconds)."
              if [ $MINUTES -gt 10 ]; then
                echo "::warning::GitHub Actions schedule delayed or skipped! Previous run was $MINUTES minutes ago."
              fi
            fi
          else
            echo "No previous run timestamp found in cache."
          fi
          echo "$NOW" > .cron-last-run.txt

      - name: Save last run timestamp to cache
        uses: actions/cache/save@v4
        if: always()
        with:
          path: .cron-last-run.txt
          key: cron-last-run-${{ github.run_id }}-${{ github.run_number }}

      - name: Execute Cron Endpoints
        run: |
          MINUTE=$(date -u +%-M)
          HOUR=$(date -u +%-H)
          EVENT_NAME="${{ github.event_name }}"

          echo "Trigger event: $EVENT_NAME, Current UTC time: $(date -u '+%Y-%m-%d %H:%M:%S') (Hour: $HOUR, Minute: $MINUTE)"
          echo "Base URL: $BASE_URL"

          if [ -z "$SECRET" ]; then
            echo "::error::CRON_SECRET repository secret is missing. Add it in Settings → Secrets and variables → Actions → Secrets → New repository secret (same value as in Vercel Production env)."
            exit 1
          fi

          echo "secret length: ${#SECRET}"

          # Check CRON_ACTIVE_HOURS_UTC if set
          if [ -n "$CRON_ACTIVE_HOURS_UTC" ]; then
            echo "Checking active hours window: $CRON_ACTIVE_HOURS_UTC (Current UTC Hour: $HOUR)"
            IS_ACTIVE=false

            if [[ "$CRON_ACTIVE_HOURS_UTC" =~ ^([0-9]+)-([0-9]+)$ ]]; then
              START_H="${BASH_REMATCH[1]}"
              END_H="${BASH_REMATCH[2]}"
              if [ "$HOUR" -ge "$START_H" ] && [ "$HOUR" -le "$END_H" ]; then
                IS_ACTIVE=true
              fi
            elif [[ "$CRON_ACTIVE_HOURS_UTC" =~ , ]]; then
              IFS=',' read -ra HOURS_LIST <<< "$CRON_ACTIVE_HOURS_UTC"
              for h in "${HOURS_LIST[@]}"; do
                if [ "$((10#$h))" -eq "$((10#$HOUR))" ]; then
                  IS_ACTIVE=true
                  break
                fi
              done
            else
              if [ "$((10#$CRON_ACTIVE_HOURS_UTC))" -eq "$((10#$HOUR))" ]; then
                IS_ACTIVE=true
              fi
            fi

            if [ "$IS_ACTIVE" = "false" ]; then
              echo "⏸ Skipping cron execution: current UTC hour ($HOUR) is outside active window ($CRON_ACTIVE_HOURS_UTC UTC)."
              exit 0
            fi
          fi

          # Warm-up request to wake cold serverless instances
          echo "Warming up serverless instance at $BASE_URL..."
          curl -s -I --max-time 15 --retry 2 "$BASE_URL" > /dev/null || true

          HAS_401=false

          run_cron() {
            ENDPOINT="$1"
            URL="$BASE_URL/api/cron/$ENDPOINT"
            echo "----------------------------------------"
            echo "Executing: $ENDPOINT"

            RESPONSE=$(curl -s --max-time 60 --retry 3 --retry-delay 2 -H "Authorization: Bearer $SECRET" -w "\nHTTP_STATUS:%{http_code}" "$URL")
            HTTP_BODY=$(echo "$RESPONSE" | sed '$d')
            HTTP_STATUS=$(echo "$RESPONSE" | tail -n 1 | sed 's/HTTP_STATUS://')

            echo "HTTP Status Code: $HTTP_STATUS"
            echo "Response Body: $HTTP_BODY"

            if [ "$HTTP_STATUS" = "401" ]; then
              echo "::error::401 Unauthorized for endpoint $ENDPOINT! CRON_SECRET mismatch or missing."
              HAS_401=true
            elif [ "$HTTP_STATUS" != "200" ]; then
              echo "::warning::Endpoint $ENDPOINT returned HTTP status $HTTP_STATUS"
            fi
          }

          echo "Running all cron endpoints on every schedule cycle..."
          run_cron "checkGeneralNotifications"
          run_cron "checkGameNotifications"
          run_cron "checkAndCompleteTournaments"
          run_cron "notifyAbsentPlayers"
          run_cron "checkBountyAwards"
          run_cron "sendGameInvitations"
          run_cron "checkNewGameAnnouncements"

          if [ "$HAS_401" = "true" ]; then
            echo "::error::One or more endpoints failed with 401 Unauthorized."
            exit 1
          fi
